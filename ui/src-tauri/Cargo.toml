[package]
name = "asysounds"
version = "0.1.0"
edition = "2024"

[lib]
name = "asysounds_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
asysounds_core = { path = "../.." }
